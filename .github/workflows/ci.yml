name: AudioRouter CI

# AudioRouter is a Windows 11 x64 product: the audio backend, shell and most
# crates build only for Windows, so the build and test job runs on Windows.
# The toolchain matches the manual release workflow so lints do not change
# underneath us.
#
# Pull requests and main pushes run only checks for changed areas (see the
# `changes` job). Manual runs execute the full quality inventory.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      contracts: ${{ steps.detect.outputs.contracts }}
      ui: ${{ steps.detect.outputs.ui }}
      probe: ${{ steps.detect.outputs.probe }}
      sdk: ${{ steps.detect.outputs.sdk }}
      release: ${{ steps.detect.outputs.release }}
      windows: ${{ steps.detect.outputs.windows }}
      rust: ${{ steps.detect.outputs.rust }}
      supply: ${{ steps.detect.outputs.supply }}
      streamdeck: ${{ steps.detect.outputs.streamdeck }}
      docs: ${{ steps.detect.outputs.docs }}
      site: ${{ steps.detect.outputs.site }}
      site_pages_b64: ${{ steps.detect.outputs.site_pages_b64 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull_request checkout is the merge commit; its first parent is
          # the base branch tip, so HEAD^1..HEAD is exactly the PR's change.
          fetch-depth: 2

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Classify changed files
        id: detect
        run: node tools/quality/policy.mjs --github --event "${{ github.event_name }}"

  docs:
    name: Validate documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Validate documentation
        run: node tools/quality/verify.mjs --checks docs

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  site:
    name: Website checks
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Validate changed website metadata and guides
        env:
          SITE_PAGES_B64: ${{ needs.changes.outputs.site_pages_b64 }}
        run: node tools/quality/verify.mjs --checks site

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  # cargo-deny reads Cargo metadata only, so Linux can resolve the Windows-only
  # dependency graph (deny.toml limits it to x86_64-pc-windows-msvc).
  supply-chain:
    name: Dependency advisories, licenses and sources
    needs: changes
    if: needs.changes.outputs.supply == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-16 action revision
        with:
          toolchain: 1.96.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Dependency policy
        run: node tools/quality/verify.mjs --checks cargo-deny,npm-audit

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows build, tests and release preparation
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Install pinned Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-16 action revision
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      # All-feature shell lint embeds frontendDist through custom-protocol.
      - name: Install UI dependencies
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.release == 'true'
        run: npm ci --prefix ui

      - name: Check formatting
        if: needs.changes.outputs.backend == 'true'
        shell: pwsh
        run: node tools/quality/verify.mjs --checks rust-format

      - name: Strict Clippy (workspace and desktop shell)
        if: needs.changes.outputs.backend == 'true'
        run: node tools/quality/verify.mjs --checks rust-clippy

      # Includes the Windows audio adapter; its tests that need real audio
      # endpoints are #[ignore]d, since hosted runners have none.
      - name: Test workspace (no audio hardware)
        if: needs.changes.outputs.backend == 'true'
        run: node tools/quality/verify.mjs --checks rust-tests

      - name: Test desktop shell
        if: needs.changes.outputs.backend == 'true'
        run: node tools/quality/verify.mjs --checks shell-tests

      - name: Check and compile native WASAPI probes
        if: needs.changes.outputs.probe == 'true'
        run: node tools/quality/verify.mjs --checks probe-build

      - name: CLI parity acceptance
        if: needs.changes.outputs.backend == 'true'
        shell: pwsh
        run: node tools/quality/verify.mjs --checks cli-parity

      # The drift check compares the TypeScript contracts with what the Rust
      # CLI discovers, so a change on either side runs it.
      - name: Install contract dependencies and check API drift
        if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.backend == 'true'
        shell: pwsh
        run: |
          npm ci --prefix contracts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node tools/quality/verify.mjs --checks contract-type,contract-drift

      - name: Test and build UI
        if: needs.changes.outputs.ui == 'true'
        shell: pwsh
        run: node tools/quality/verify.mjs --checks ui-format,ui-lint,ui-tests,ui-build

      - name: Verify SDK installer provenance
        if: needs.changes.outputs.sdk == 'true'
        shell: pwsh
        run: node tools/quality/verify.mjs --checks sdk-provenance

      - name: Test release tooling
        if: needs.changes.outputs.release == 'true'
        shell: pwsh
        run: node tools/quality/verify.mjs --checks release-tests

      - name: Build and verify the unsigned installer and release assets
        if: needs.changes.outputs.release == 'true'
        shell: pwsh
        env:
          # `gh attestation verify` (OpenAI tunnel runtime provenance) needs a
          # token even for a public repository's attestations.
          GH_TOKEN: ${{ github.token }}
        run: node tools/quality/verify.mjs --checks release-build

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  # TEMPORARY (PR #139 CI debugging): a short fixture-only crash reproduction.
  fixture-debug:
    name: TEMP fixture stack diagnostics
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-16 action revision
        with:
          toolchain: 1.96.0

      - name: Install debugger and build fixture
        shell: pwsh
        run: |
          choco install windows-sdk-10.0 --no-progress -y --ignore-package-exit-codes
          cargo build -p audiorouter-control --example e2e_backend --locked
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe', 'C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue

      - name: Stress fixture under debugger
        shell: pwsh
        run: |
          $cdb = @('C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe', 'C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cdb) { throw 'cdb was not installed' }
          $exe = (Resolve-Path 'target/debug/examples/e2e_backend.exe').Path
          $failed = $false
          for ($index = 0; $index -lt 200; $index++) {
            $directory = Join-Path $env:TEMP ("audiorouter-e2e-debug-" + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $directory | Out-Null
            $requests = @('{"jsonrpc":"2.0","id":1,"method":"sessions.active.get"}', '{"jsonrpc":"2.0","id":2,"method":"presets.list"}', '{"jsonrpc":"2.0","id":3,"method":"processors.list"}', '{"jsonrpc":"2.0","id":4,"method":"sessions.list","params":{"limit":500}}', '{"jsonrpc":"2.0","id":5,"method":"recordings.list","params":{"sessionId":"demo-session","limit":500}}', '{"jsonrpc":"2.0","id":6,"method":"recorders.list"}', '{"jsonrpc":"2.0","id":7,"method":"status.get"}', '{"jsonrpc":"2.0","id":8,"method":"system.diagnostics"}', '{"jsonrpc":"2.0","id":9,"method":"system.describe"}', '{"jsonrpc":"2.0","id":10,"method":"sessions.get","params":{"sessionId":"e2e-session"}}') -join "`n"
            $result = $requests | & $cdb -c 'sxe av; sxe sov; g; kc 200; !peb; q' $exe $directory 2>&1 | Out-String
            if ($result -match 'overflowed its stack|STATUS_STACK_OVERFLOW|c00000fd') {
              "CRASH ITERATION $index"
              $result
              $failed = $true
              break
            }
            if ($index % 20 -eq 0) { "completed iteration $index" }
            Remove-Item -LiteralPath $directory -Recurse -Force
          }
          if ($failed) { exit 1 }

      - name: Locate debugger logs
        if: always()
        shell: pwsh
        run: Get-ChildItem $env:TEMP -Filter '*.dmp' -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length

  browser:
    name: UI browser tests (Edge)
    needs: changes
    # The browser tests drive the real backend through the e2e_backend fixture.
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-16 action revision
        with:
          toolchain: 1.96.0

      - name: Install contract and UI dependencies
        shell: pwsh
        run: |
          npm ci --prefix contracts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm ci --prefix ui

      # TEMPORARY (PR #139 CI debugging): the fixture overflows its main stack
      # only on the hosted runner. Capture a WER dump to find the call stack.
      - name: Enable fixture crash dumps
        shell: pwsh
        run: |
          $dump = "${{ runner.temp }}/e2e-crash-dumps"
          New-Item -ItemType Directory -Force -Path $dump | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value $dump
          Set-ItemProperty -Path $key -Name DumpType -Value 2 -Type DWord

      # Builds the e2e_backend fixture and every browser entry, then runs the
      # full Playwright discovery against bundled assets. README screenshot
      # generators stay off (they write into docs/).
      # playwright.config.ts runs one worker when CI is set.
      - name: Run Playwright tests
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
        run: node tools/quality/verify.mjs --checks browser

      # TEMPORARY (PR #139 CI debugging): upload fixture crash dumps.
      - name: Upload fixture crash dumps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-crash-dumps
          path: ${{ runner.temp }}/e2e-crash-dumps
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            ${{ runner.temp }}/audiorouter-playwright-results
            ${{ runner.temp }}/audiorouter-production-playwright-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser error-guard qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-guard-qualification
          path: |
            ${{ runner.temp }}/audiorouter-browser-guard-*
            ${{ runner.temp }}/audiorouter-bundled-asset-guard-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  policy:
    name: Verification policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Test classification, required checks and failure reporting
        run: node tools/quality/verify.mjs --checks policy

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  streamdeck:
    name: Stream Deck checks
    needs: changes
    if: needs.changes.outputs.streamdeck == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Install locked Stream Deck dependencies
        run: npm ci --prefix tools/streamdeck
      - name: Typecheck, test and build Stream Deck
        run: node tools/quality/verify.mjs --checks streamdeck-type,streamdeck-tests,streamdeck-build

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  quality-gate:
    name: Quality gate
    if: always()
    needs: [changes, docs, site, policy, supply-chain, windows, browser, streamdeck]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Require the current workflow checks to succeed
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: node tools/quality/gate.mjs

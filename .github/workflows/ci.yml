name: AudioRouter CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: Portable Rust and UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate documentation
        run: node tools/docs/validate.mjs
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci
      - name: Check contracts
        working-directory: contracts
        run: npm run typecheck && npm run check:drift
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Test and build UI
        working-directory: ui
        run: npm test && npm run build

  windows:
    name: Windows Rust validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test non-hardware workspace
        run: cargo test --workspace --locked --exclude audiorouter-windows-audio
      - name: Check Windows audio adapter
        run: cargo check -p audiorouter-windows-audio --locked
      - name: Compile native WASAPI probe
        shell: pwsh
        run: ./tests/acceptance/m00-native-build.ps1
      - name: Validate documentation acceptance wrapper
        shell: pwsh
        run: ./tests/acceptance/docs.ps1
      - name: Run M04 DSP and recording acceptance
        shell: pwsh
        run: ./tests/acceptance/m04-dsp-recording.ps1
      - name: Run M05 UI acceptance
        shell: pwsh
        run: ./tests/acceptance/m05-ui.ps1
      - name: Run M07 headless acceptance
        shell: pwsh
        run: ./tests/acceptance/m07-headless.ps1
      - name: Verify SDK installer provenance
        shell: pwsh
        run: ./tests/acceptance/m06-sdk-installer.ps1
      - name: Run M08 unsigned release acceptance
        shell: pwsh
        run: ./tests/acceptance/m08-release.ps1
      - name: Test release verifier and runbook
        shell: pwsh
        run: |
          ./tools/release/test-prepare-artifacts.ps1
          ./tools/release/test-verify-artifacts.ps1
          ./tools/release/test-runbook-command.ps1
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

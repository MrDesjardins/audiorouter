name: AudioRouter CI

# AudioRouter is a Windows 11 x64 product: the audio backend, shell and most
# crates build only for Windows, so the build and test job runs on Windows.
# The toolchain matches the manual release workflow so lints do not change
# underneath us.
#
# Pull requests and main pushes run only checks for changed areas (see the
# `changes` job). Manual and scheduled runs execute the full quality inventory.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && 'manual' || 'changes' }}
  cancel-in-progress: true

env:
  # Incremental directories are large and cannot be reused across fresh checkouts.
  CARGO_INCREMENTAL: '0'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      contracts: ${{ steps.detect.outputs.contracts }}
      ui: ${{ steps.detect.outputs.ui }}
      probe: ${{ steps.detect.outputs.probe }}
      sdk: ${{ steps.detect.outputs.sdk }}
      release: ${{ steps.detect.outputs.release }}
      windows: ${{ steps.detect.outputs.windows }}
      rust: ${{ steps.detect.outputs.rust }}
      supply: ${{ steps.detect.outputs.supply }}
      streamdeck: ${{ steps.detect.outputs.streamdeck }}
      docs: ${{ steps.detect.outputs.docs }}
      site: ${{ steps.detect.outputs.site }}
      site_pages_b64: ${{ steps.detect.outputs.site_pages_b64 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull_request checkout is the merge commit; its first parent is
          # the base branch tip, so HEAD^1..HEAD is exactly the PR's change.
          fetch-depth: 2

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Classify changed files
        id: detect
        run: node tools/quality/policy.mjs --github --event "${{ github.event_name }}"

  docs:
    name: Validate documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Validate documentation
        run: node tools/quality/verify.mjs --checks docs

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  site:
    name: Website checks
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Validate changed website metadata and guides
        env:
          SITE_PAGES_B64: ${{ needs.changes.outputs.site_pages_b64 }}
        run: node tools/quality/verify.mjs --checks site

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  # cargo-deny reads Cargo metadata only, so Linux can resolve the Windows-only
  # dependency graph (deny.toml limits it to x86_64-pc-windows-msvc).
  supply-chain:
    name: Dependency advisories, licenses and sources
    needs: changes
    if: needs.changes.outputs.supply == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-16 action revision
        with:
          toolchain: 1.96.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Dependency policy
        run: node tools/quality/verify.mjs --checks cargo-deny,npm-audit

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows Rust and native checks
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.probe == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Install pinned Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-16 action revision
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Restore Rust dependencies and build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/target
          key: rust-windows-${{ runner.arch }}-1.96.0-${{ hashFiles('**/Cargo.lock') }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            rust-windows-${{ runner.arch }}-1.96.0-${{ hashFiles('**/Cargo.lock') }}-${{ github.job }}-

      # All-feature shell lint embeds frontendDist through custom-protocol.
      - name: Install UI dependencies
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.release == 'true'
        run: npm ci --prefix ui

      - name: Check formatting
        if: needs.changes.outputs.backend == 'true'
        shell: pwsh
        run: node tools/quality/verify.mjs --checks rust-format

      - name: Strict Clippy (workspace and desktop shell)
        if: needs.changes.outputs.backend == 'true'
        run: node tools/quality/verify.mjs --checks rust-clippy

      # Includes the Windows audio adapter; its tests that need real audio
      # endpoints are #[ignore]d, since hosted runners have none.
      - name: Test workspace (no audio hardware)
        if: needs.changes.outputs.backend == 'true'
        run: node tools/quality/verify.mjs --checks rust-tests

      - name: Test desktop shell
        if: needs.changes.outputs.backend == 'true'
        run: node tools/quality/verify.mjs --checks shell-tests

      - name: Check and compile native WASAPI probes
        if: needs.changes.outputs.probe == 'true'
        run: node tools/quality/verify.mjs --checks probe-build

      - name: CLI parity acceptance
        if: needs.changes.outputs.backend == 'true'
        shell: pwsh
        run: node tools/quality/verify.mjs --checks cli-parity

      # The drift check compares the TypeScript contracts with what the Rust
      # CLI discovers, so a change on either side runs it.
      - name: Install contract dependencies and check API drift
        if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.backend == 'true'
        shell: pwsh
        run: |
          npm ci --prefix contracts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node tools/quality/verify.mjs --checks contract-type,contract-drift

      - name: Verify SDK installer provenance
        if: needs.changes.outputs.sdk == 'true'
        shell: pwsh
        run: node tools/quality/verify.mjs --checks sdk-provenance

      - name: Save trusted Rust cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/target
          key: rust-windows-${{ runner.arch }}-1.96.0-${{ hashFiles('**/Cargo.lock') }}-${{ github.job }}-${{ github.sha }}

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  browser-prepare:
    name: Build browser fixtures
    needs: changes
    # The browser tests drive the real backend through the e2e_backend fixture.
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-16 action revision
        with:
          toolchain: 1.96.0

      - name: Install contract and UI dependencies
        shell: pwsh
        run: |
          npm ci --prefix contracts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm ci --prefix ui

      # Build once; dependent shards download the exact generated fixtures.
      # Guard qualification remains mandatory before any shard can succeed.
      - name: Prepare browser fixtures and qualify guards
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
        run: node tools/quality/browser-ci.mjs prepare

      - name: Upload browser fixtures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-fixtures
          path: |
            target/debug/examples/e2e_backend.exe
            target/browser-acceptance-ui
          if-no-files-found: error
          retention-days: 1

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-prepare
          path: |
            ${{ runner.temp }}/audiorouter-playwright-results
            ${{ runner.temp }}/audiorouter-production-playwright-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser error-guard qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-guard-qualification
          path: |
            ${{ runner.temp }}/audiorouter-browser-guard-*
            ${{ runner.temp }}/audiorouter-bundled-asset-guard-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  ui:
    name: UI format, lint, tests and build
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - run: npm ci --prefix ui
      - run: node tools/quality/verify.mjs --checks ui-format,ui-lint,ui-tests,ui-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Windows installer and release checks
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
      - run: npm ci --prefix ui
      - name: Test release tooling
        run: node tools/quality/verify.mjs --checks release-tests
      - name: Build and verify the unsigned installer and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/quality/verify.mjs --checks release-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: UI browser tests (Edge shard ${{ matrix.shard }}/4)
    needs: [changes, browser-prepare]
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - run: npm ci --prefix ui
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: browser-fixtures
          path: target
      - name: Run Playwright tests
        env:
          BROWSER_SHARD: ${{ matrix.shard }}/4
          BROWSER_SCOPE: ${{ needs.changes.outputs.ui == 'true' && 'all' || 'backend' }}
          TEMP: ${{ runner.temp }}
        run: node tools/quality/verify.mjs --checks browser
      - name: Upload shard verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-browser-${{ matrix.shard }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload shard traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/audiorouter-playwright-results
          if-no-files-found: ignore
          retention-days: 7

  policy:
    name: Verification policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Test classification, required checks and failure reporting
        run: node tools/quality/verify.mjs --checks policy

      - name: Validate all workflow syntax and expressions
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck="" -pyflakes=""

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  streamdeck:
    name: Stream Deck checks
    needs: changes
    if: needs.changes.outputs.streamdeck == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Install locked Stream Deck dependencies
        run: npm ci --prefix tools/streamdeck
      - name: Typecheck, test and build Stream Deck
        run: node tools/quality/verify.mjs --checks streamdeck-type,streamdeck-tests,streamdeck-build

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/audiorouter-verification/*.json
          if-no-files-found: ignore
          retention-days: 14

  quality-gate:
    name: Quality gate
    if: always()
    needs: [changes, docs, site, policy, supply-chain, windows, ui, release, browser-prepare, browser, streamdeck]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Require the current workflow checks to succeed
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: node tools/quality/gate.mjs

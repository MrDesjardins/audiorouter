name: AudioRouter CI

# AudioRouter is a Windows 11 x64 product: the audio backend, shell and most
# crates build only for Windows, so CI runs on Windows alone. The toolchain
# matches the manual release workflow so lints do not change underneath us.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build, tests and release preparation
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-16 action revision
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Validate documentation
        shell: pwsh
        run: ./tests/acceptance/docs.ps1

      - name: Check formatting
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Strict Clippy (workspace)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Strict Clippy (desktop shell)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test workspace (no audio hardware)
        run: cargo test --workspace --locked --exclude audiorouter-windows-audio

      - name: Check Windows audio adapter
        run: cargo check -p audiorouter-windows-audio --locked

      - name: Test desktop shell
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Check native Rust WASAPI probe
        run: cargo check --manifest-path tools/m00-wasapi-probe/Cargo.toml --locked

      - name: Compile native WASAPI probe
        shell: pwsh
        run: ./tests/acceptance/m00-native-build.ps1

      - name: CLI parity acceptance
        shell: pwsh
        run: ./tests/acceptance/m01-cli.ps1

      - name: Install contract dependencies and check API drift
        shell: pwsh
        run: |
          npm ci --prefix contracts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm --prefix contracts run typecheck
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm --prefix contracts run check:drift

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Test and build UI
        shell: pwsh
        run: |
          npm --prefix ui test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm --prefix ui run build

      - name: Verify SDK installer provenance
        shell: pwsh
        run: ./tests/acceptance/m06-sdk-installer.ps1

      - name: Test release tooling
        shell: pwsh
        run: |
          ./tools/release/test-prepare-artifacts.ps1
          ./tools/release/test-verify-artifacts.ps1
          ./tools/release/test-runbook-command.ps1

      - name: Build and verify the unsigned installer and release assets
        shell: pwsh
        run: ./tests/acceptance/m08-release.ps1

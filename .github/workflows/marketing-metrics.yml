name: Marketing metrics (weekly)

# Marketing plan task 0.9: GitHub keeps repository traffic (views, clones,
# referrers) for 14 days only, so record the public project numbers once a
# week in docs/marketing-metrics.csv. See docs/plans/future/marketing.md.
#
# The traffic API is not available to GITHUB_TOKEN. METRICS_TOKEN is a
# fine-grained personal access token limited to this repository with
# "Administration: Read-only" (traffic) and "Metadata: Read-only".
on:
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-metrics
  cancel-in-progress: false

jobs:
  snapshot:
    name: Record weekly numbers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Append this week's row
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the METRICS_TOKEN repository secret (see the comment at the top of this workflow)."
            exit 1
          fi
          node tools/marketing/snapshot-metrics.mjs

      - name: Commit the row
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/marketing-metrics.csv
          git commit -m "docs: record weekly marketing metrics"
          git pull --rebase origin main
          git push origin HEAD:main

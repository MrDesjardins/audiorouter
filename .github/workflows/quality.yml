name: Isolated standard-user launcher diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Qualify restricted-token descendants
        shell: pwsh
        run: node --test tools/quality/standard-user.test.mjs
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: standard-user-diagnostic
          path: |
            ${{ runner.temp }}/audiorouter-standard-user-qualification/*/*.json
            ${{ runner.temp }}/audiorouter-standard-user-qualification/*/*.log

name: AudioRouter quality (nightly)

# Code review P2-8: coverage, an engine soak and a startup timing, nightly and
# on demand; Q4.3 adds scaled bounded fuzzing; Q5.1 adds the Edge suite's
# first-pass failures, retries and duration. Coverage is reported, never gated. The soak fails on a memory
# leak or a slow quantum (limits in crates/engine/examples/soak.rs and
# docs/spec/14-quality.md NFR-04/05/06). Each run adds a row to a small trend
# table kept in the Actions cache; quality-history.yml publishes the durable
# copy to the unprotected `quality-data` branch.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: Engine soak duration in minutes
        required: false
        default: "20"
        type: string
      fuzz_scale:
        description: Bounded fuzzing iteration multiplier (1-50)
        required: false
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Rust and UI coverage
    env:
      # Keep fixed PR seeds and add one reproducible seed per nightly/manual run.
      AUDIOROUTER_TEST_SEED: ${{ github.run_id }}
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-16 action revision
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov@0.9.1

      # The whole workspace, as `cargo test --workspace` runs it in CI;
      # the summary also totals the portable crates on their own.
      - name: Rust coverage (workspace)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'coverage'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          cargo llvm-cov --workspace --locked --no-report
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo llvm-cov report --json --summary-only --output-path (Join-Path $out 'rust-workspace.json')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo llvm-cov report --lcov --output-path (Join-Path $out 'rust-workspace.lcov')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo llvm-cov report --html --output-dir (Join-Path $out 'rust-workspace-html')

      - name: Rust coverage (desktop shell)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'coverage'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --locked --no-report
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo llvm-cov report --manifest-path src-tauri/Cargo.toml --json --summary-only --output-path (Join-Path $out 'rust-shell.json')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo llvm-cov report --manifest-path src-tauri/Cargo.toml --lcov --output-path (Join-Path $out 'rust-shell.lcov')

      - name: UI coverage
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          "Generated editor seed: $env:AUDIOROUTER_TEST_SEED (plus fixed seeds)" >> $env:GITHUB_STEP_SUMMARY
          npm ci --prefix ui
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm --prefix ui run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'coverage'
          $metrics = Join-Path $env:RUNNER_TEMP 'metrics'
          New-Item -ItemType Directory -Force -Path $metrics | Out-Null
          $lines = @()
          $workspace = Join-Path $out 'rust-workspace.json'
          if (Test-Path $workspace) {
            node tools/quality/summary.mjs rust $workspace 'Rust coverage (workspace)' >> $env:GITHUB_STEP_SUMMARY
            $lines += 'rust_lines={0:F1}' -f (Get-Content $workspace -Raw | ConvertFrom-Json).data[0].totals.lines.percent
          }
          $shell = Join-Path $out 'rust-shell.json'
          if (Test-Path $shell) {
            node tools/quality/summary.mjs rust $shell 'Rust coverage (desktop shell)' >> $env:GITHUB_STEP_SUMMARY
            $lines += 'shell_lines={0:F1}' -f (Get-Content $shell -Raw | ConvertFrom-Json).data[0].totals.lines.percent
          }
          if (Test-Path ui/coverage/coverage-summary.json) {
            node tools/quality/summary.mjs ui ui/coverage/coverage-summary.json >> $env:GITHUB_STEP_SUMMARY
            $lines += 'ui_lines={0:F1}' -f (Get-Content ui/coverage/coverage-summary.json -Raw | ConvertFrom-Json).total.lines.pct
          }
          $lines | Set-Content -Encoding ascii (Join-Path $metrics 'coverage.env')

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            ${{ runner.temp }}/coverage
            ui/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metrics-coverage
          path: ${{ runner.temp }}/metrics
          if-no-files-found: ignore
          retention-days: 14

  soak:
    name: Engine soak
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SOAK_MINUTES: ${{ inputs.soak_minutes || '20' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-16 action revision
        with:
          toolchain: 1.96.0

      - name: Build the soak example
        run: cargo build --release --locked -p audiorouter-engine --example soak

      # The example checks heap growth, allocations and per-quantum time
      # itself. From outside, this step samples the process's private bytes
      # and working set, and fails if private bytes grow by 10 MiB or more
      # after the warm-up (NFR-06's limit for 8 hours).
      - name: Run the soak
        shell: pwsh
        run: |
          $seconds = [double]$env:SOAK_MINUTES * 60
          if ($seconds -le 0) { throw "soak_minutes must be positive" }
          $env:AUDIOROUTER_SOAK_SECONDS = "$seconds"
          $metrics = Join-Path $env:RUNNER_TEMP 'metrics'
          New-Item -ItemType Directory -Force -Path $metrics | Out-Null
          $metricsFile = Join-Path $metrics 'soak.env'
          $env:AUDIOROUTER_SOAK_METRICS = $metricsFile
          $report = Join-Path $env:RUNNER_TEMP 'soak.md'
          $progress = Join-Path $env:RUNNER_TEMP 'soak.err'
          $process = Start-Process -FilePath 'target/release/examples/soak.exe' -NoNewWindow -PassThru `
            -RedirectStandardOutput $report -RedirectStandardError $progress
          $null = $process.Handle  # keeps ExitCode available after exit
          $started = Get-Date
          $samples = [System.Collections.Generic.List[object]]::new()
          while (-not $process.WaitForExit(15000)) {
            $process.Refresh()
            $samples.Add([pscustomobject]@{
              Seconds = [int]((Get-Date) - $started).TotalSeconds
              PrivateMiB = [math]::Round($process.PrivateMemorySize64 / 1MB, 1)
              WorkingSetMiB = [math]::Round($process.WorkingSet64 / 1MB, 1)
            })
          }
          $process.WaitForExit()
          $exitCode = $process.ExitCode
          Get-Content $progress | Select-Object -Last 3
          Get-Content $report | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content $report

          $warmUp = [math]::Max(1, $seconds / 10)
          $steady = @($samples | Where-Object { $_.Seconds -ge $warmUp })
          $growth = 0.0
          if ($steady.Count -ge 2) { $growth = $steady[-1].PrivateMiB - $steady[0].PrivateMiB }
          $summary = @('', '### Windows process memory (sampled every 15 s)', '',
            '| Elapsed (s) | Private (MiB) | Working set (MiB) |', '| ---: | ---: | ---: |')
          $step = [math]::Max(1, [math]::Ceiling($samples.Count / 12))
          for ($i = 0; $i -lt $samples.Count; $i++) {
            if ($i % $step -eq 0 -or $i -eq $samples.Count - 1) {
              $s = $samples[$i]
              $summary += "| $($s.Seconds) | $($s.PrivateMiB) | $($s.WorkingSetMiB) |"
            }
          }
          $memoryOk = $growth -lt 10
          $result = if ($memoryOk) { 'pass' } else { '**FAIL**' }
          $summary += @('', "Private bytes growth after warm-up: $([math]::Round($growth, 1)) MiB (limit < 10 MiB): $result", '')
          $summary | Add-Content $env:GITHUB_STEP_SUMMARY
          $summary
          Add-Content $metricsFile ('soak_private_growth_mib={0:F1}' -f $growth)
          if ($exitCode -ne 0) { throw "soak checks failed (exit code $exitCode)" }
          if (-not $memoryOk) { throw "private bytes grew by $growth MiB after warm-up" }

      - name: Upload soak metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metrics-soak
          path: ${{ runner.temp }}/metrics
          if-no-files-found: ignore
          retention-days: 14

  # Q4.3: the bounded fuzz targets for untrusted-input parsers (protocol frames,
  # network datagrams, plugin presets and worker frames, audio files, session
  # imports, recordings, control dispatch). Pull requests run each target at
  # scale 1 inside `cargo test`; here every iteration count is multiplied by
  # AUDIOROUTER_FUZZ_SCALE. The seeds are fixed in the tests, so a failure
  # prints its target, seed and case index and replays exactly. Debug profile on
  # purpose: some defects (an arithmetic overflow in a third-party decoder) only
  # panic with overflow checks. The job reports pass or fail, not timings, and is
  # not part of the trend table.
  fuzz:
    name: Bounded fuzzing (scaled)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      AUDIOROUTER_FUZZ_SCALE: ${{ inputs.fuzz_scale || '10' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-16 action revision
        with:
          toolchain: 1.96.0

      - name: Run the fuzz targets at scale
        shell: pwsh
        run: |
          # The tests ignore a scale outside 1-1000 without saying so; refuse
          # one outside 1-50 here so a typo cannot make the run unbounded.
          $scale = 0
          if (-not [int]::TryParse($env:AUDIOROUTER_FUZZ_SCALE, [ref]$scale) -or $scale -lt 1 -or $scale -gt 50) {
            throw "fuzz_scale must be a whole number from 1 to 50, got '$($env:AUDIOROUTER_FUZZ_SCALE)'"
          }
          $targets = @(
            @{ Name = 'protocol';    Arguments = @('-p', 'audiorouter-protocol', '--test', 'bounded_fuzz', '--test', 'network_fuzz') },
            @{ Name = 'plugin-host'; Arguments = @('-p', 'audiorouter-plugin-host', '--test', 'bounded_fuzz') },
            @{ Name = 'engine';      Arguments = @('-p', 'audiorouter-engine', '--test', 'bounded_fuzz') },
            @{ Name = 'storage';     Arguments = @('-p', 'audiorouter-storage', '--test', 'bounded_fuzz') },
            @{ Name = 'recording';   Arguments = @('-p', 'audiorouter-recording', '--test', 'bounded_fuzz') },
            @{ Name = 'control';     Arguments = @('-p', 'audiorouter-control', '--lib', 'bounded_fuzz_tests') }
          )
          $summary = @("## Bounded fuzzing at scale $scale", '', '| Target | Result |', '| --- | --- |')
          $failed = @()
          foreach ($target in $targets) {
            $cargoArguments = $target.Arguments
            cargo test --locked @cargoArguments
            $passed = $LASTEXITCODE -eq 0
            if (-not $passed) { $failed += $target.Name }
            $summary += "| $($target.Name) | $(if ($passed) { 'pass' } else { '**FAIL**' }) |"
          }
          $summary += @('', 'A failure prints its target, seed and case index; `case_rng(seed, index)` in tests/support/fuzz.rs rebuilds that case.')
          $summary | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($failed.Count -gt 0) { throw "fuzz targets failed: $($failed -join ', ')" }

  # NFR-14, backend part: launch the release shell as a fresh install (the
  # fresh_install_shell test) and time its embedded backend's first answer.
  # The packaged smoke also measures usable UI readiness with a fresh profile
  # and after a restart. Timings remain informational until Q5 calibration.
  startup:
    name: Startup timing (fresh install)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-16 action revision
        with:
          toolchain: 1.96.0

      # custom-protocol embeds ui/dist; without it the release shell loads
      # the development URL (AGENTS.md lesson 2026-09-26).
      - name: Qualify standard-user launcher
        shell: pwsh
        run: node --test tools/quality/standard-user.test.mjs

      - name: Build the UI and the release shell
        shell: pwsh
        run: |
          npm ci --prefix ui
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm --prefix ui run build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo build --manifest-path src-tauri/Cargo.toml --release --locked --features custom-protocol

      - name: Ensure WebView2 runtime on the disposable runner
        shell: pwsh
        run: ./tools/quality/ensure-webview2.ps1 -Output (Join-Path $env:RUNNER_TEMP 'metrics/webview2-runtime.json') -InstallMissing

      - name: Launch as a fresh install and time the backend
        shell: pwsh
        run: |
          $metrics = Join-Path $env:RUNNER_TEMP 'metrics'
          New-Item -ItemType Directory -Force -Path $metrics | Out-Null
          $env:AUDIOROUTER_SHELL_EXE = (Resolve-Path 'src-tauri/target/release/audiorouter-shell.exe').Path
          $env:AUDIOROUTER_STARTUP_METRICS = Join-Path $metrics 'startup.env'
          cargo test -p audiorouter-transport --test fresh_install_shell --locked -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ms = ((Get-Content $env:AUDIOROUTER_STARTUP_METRICS) -replace '^backend_ready_ms=', '')
          @('## Startup (NFR-14, backend part)', '',
            '| Measure | Target (NFR-14) | Measured |', '| --- | --- | --- |',
            "| Launch to first backend answer (fresh install, hosted runner) | UI ready ≤ 3 s warm / 8 s cold | $ms ms |",
            '', 'Packaged UI readiness is measured separately by the following smoke.', '') |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Qualify packaged smoke guards
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'audiorouter-packaged-shell-qualification'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $arguments = Join-Path $out 'launch-arguments.json'
          @('tools/quality/qualify-packaged-shell-smoke.mjs', '--shell', 'src-tauri/target/release/audiorouter-shell.exe', '--output', $out) |
            ConvertTo-Json | Set-Content -LiteralPath $arguments -Encoding UTF8
          ./tools/quality/standard-user-process.ps1 -Executable (Get-Command node).Source -ArgumentsFile $arguments -Report (Join-Path $out 'launch-token.json')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $result = Get-Content (Join-Path $out 'qualification.json') -Raw | ConvertFrom-Json
          @('## Packaged smoke guard qualification', '',
            "$($result.cases.Count) cases passed: normal operation, preflight/startup failures, native bridge/readiness/page errors, refused quit and real console-break cancellation.", '') |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Packaged WebView2 smoke
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'audiorouter-packaged-shell-smoke'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $arguments = Join-Path $out 'launch-arguments.json'
          @('tools/quality/packaged-shell-smoke.mjs', '--shell', 'src-tauri/target/release/audiorouter-shell.exe', '--output', $out, '--timeout-ms', '60000') |
            ConvertTo-Json | Set-Content -LiteralPath $arguments -Encoding UTF8
          ./tools/quality/standard-user-process.ps1 -Executable (Get-Command node).Source -ArgumentsFile $arguments -Report (Join-Path $out 'launch-token.json')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $result = Get-Content (Join-Path $out 'result.json') -Raw | ConvertFrom-Json
          @('## Packaged UI smoke', '',
            "Fresh-profile usable canvas: $($result.metrics.coldUiReadyMs) ms.",
            "Usable canvas after restart: $($result.metrics.warmUiReadyMs) ms.",
            'Native bridge, stopped/no-grant state and session save/reload passed.',
            "Shell SHA-256: $($result.shellSha256)", '',
            'Timings are informational pending Q5 runner calibration; fresh-profile launch is not an OS-cold measurement.', '') |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload startup metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metrics-startup
          path: ${{ runner.temp }}/metrics
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload standard-user launcher evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: standard-user-qualification
          path: |
            ${{ runner.temp }}/audiorouter-standard-user-qualification/*/*.json
            ${{ runner.temp }}/audiorouter-standard-user-qualification/*/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload packaged WebView2 smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packaged-webview-smoke
          path: |
            ${{ runner.temp }}/audiorouter-packaged-shell-smoke/*.json
            ${{ runner.temp }}/audiorouter-packaged-shell-smoke/*.log
            ${{ runner.temp }}/audiorouter-packaged-shell-smoke/*.jsonl
            ${{ runner.temp }}/audiorouter-packaged-shell-smoke/*.panic
            ${{ runner.temp }}/audiorouter-packaged-shell-smoke/*.png
            ${{ runner.temp }}/audiorouter-packaged-shell-smoke/*.html
            ${{ runner.temp }}/audiorouter-packaged-shell-smoke/*.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload packaged smoke qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packaged-smoke-qualification
          path: |
            ${{ runner.temp }}/audiorouter-packaged-shell-qualification/qualification.json
            ${{ runner.temp }}/audiorouter-packaged-shell-qualification/launch-token.json
            ${{ runner.temp }}/audiorouter-packaged-shell-qualification/*/*.json
            ${{ runner.temp }}/audiorouter-packaged-shell-qualification/*/*.log
            ${{ runner.temp }}/audiorouter-packaged-shell-qualification/*/*.jsonl
            ${{ runner.temp }}/audiorouter-packaged-shell-qualification/*/*.panic
            ${{ runner.temp }}/audiorouter-packaged-shell-qualification/*/*.png
            ${{ runner.temp }}/audiorouter-packaged-shell-qualification/*/*.html
            ${{ runner.temp }}/audiorouter-packaged-shell-qualification/*/*.zip
          if-no-files-found: ignore
          retention-days: 14

  # Q5.1: the Edge suite's first-pass failures, retries, final failures and
  # duration are trend metrics. A retried green test still fails the shard
  # (`failOnFlakyTests` in playwright.config.ts) and is still counted here;
  # a green retry never erases the first failure.
  browser-prepare:
    name: Build nightly browser fixtures
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-16 action revision
        with:
          toolchain: 1.96.0

      - name: Install contract and UI dependencies
        shell: pwsh
        run: |
          npm ci --prefix contracts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm ci --prefix ui

      # Build once; the shard jobs download the exact generated fixtures.
      - name: Prepare browser fixtures and qualify guards
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
        run: node tools/quality/browser-ci.mjs prepare

      - name: Upload browser fixtures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-fixtures
          path: |
            target/debug/examples/e2e_backend.exe
            target/browser-acceptance-ui
          if-no-files-found: error
          retention-days: 1

      - name: Upload browser error-guard qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-guard-qualification
          path: |
            ${{ runner.temp }}/audiorouter-browser-guard-*
            ${{ runner.temp }}/audiorouter-bundled-asset-guard-*
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Edge suite shard ${{ matrix.shard }}/4 (nightly metrics)
    needs: [browser-prepare]
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Download browser fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-fixtures
          path: target

      - name: Prepare the Playwright report directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'audiorouter-playwright-json') | Out-Null

      - name: Run Playwright tests
        env:
          BROWSER_SHARD: ${{ matrix.shard }}/4
          BROWSER_SCOPE: all
          TEMP: ${{ runner.temp }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/audiorouter-playwright-json/report-${{ matrix.shard }}.json
        run: node tools/quality/browser-ci.mjs run

      - name: Upload shard Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/audiorouter-playwright-json/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload shard traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/audiorouter-playwright-results
          if-no-files-found: ignore
          retention-days: 7

  browser-trend:
    name: Edge suite trend metrics
    needs: [browser]
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Download the shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: playwright-report-*
          path: playwright-json
          merge-multiple: true

      - name: Summarize first-pass failures and retries
        shell: pwsh
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $metrics = Join-Path $env:RUNNER_TEMP 'metrics'
          New-Item -ItemType Directory -Force -Path $metrics | Out-Null
          $files = @(Get-ChildItem -Path 'playwright-json' -Filter '*.json' -Recurse -ErrorAction SilentlyContinue)
          $paths = $files | ForEach-Object { $_.FullName }
          # All four shard reports are required: a partial set would count fewer
          # tests and first-pass failures than the suite actually had. The tool
          # treats a missing or unreadable report as not measured and writes no
          # browser.env, so the trend row stays blank instead of under-reporting.
          node tools/quality/test-trend.mjs playwright --expect-shards 1,2,3,4 --env (Join-Path $metrics 'browser.env') --run-url $env:RUN_URL @paths |
            Add-Content $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload browser trend metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metrics-browser
          path: ${{ runner.temp }}/metrics
          if-no-files-found: ignore
          retention-days: 14

  trend:
    name: Trend table
    needs: [coverage, soak, startup, browser-trend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Download this run's metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: metrics-*
          path: metrics
          merge-multiple: true

      - name: Restore the trend history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: quality-history.csv
          key: quality-history-${{ github.run_id }}
          restore-keys: quality-history-

      - name: Append this run and print the trend
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          declare -A value
          for file in metrics/*.env; do
            [ -f "$file" ] || continue
            while IFS='=' read -r key val; do
              [ -n "$key" ] && value[$key]=$(tr -d '\r' <<<"$val")
            done < "$file"
          done
          columns="rust_lines shell_lines ui_lines soak_p99_us soak_p999_us soak_heap_growth_kib soak_private_growth_mib backend_ready_ms browser_total browser_first_pass_failures browser_retried_tests browser_flaky browser_failed browser_skipped browser_duration_s run_url"
          args=("date=$(date -u +%Y-%m-%d)" "commit=${SHA:0:8}")
          for column in $columns; do args+=("$column=${value[$column]:-}"); done
          node tools/quality/summary.mjs history quality-history.csv "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "Blank \`browser_*\` columns mean the Edge report artifacts were not retained; that row did not measure them and they are not zero failures. \`run_url\` links this run's artifacts (browser shard reports: \`playwright-report-1\`..\`playwright-report-4\`, summary: \`metrics-browser\`). Open regression age and escaped-defect counts are not in this table: there is no tracked dataset for them, so escaped defects stay in the plan narrative."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the trend history
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: quality-history.csv
          key: quality-history-${{ github.run_id }}

      - name: Retain collected daily history
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-history-collected
          path: quality-history.csv
          if-no-files-found: error
          retention-days: 90

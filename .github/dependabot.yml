# Weekly major and minor update proposals only; patch-only updates are ignored.
# Minor npm/Actions groups merge after CI; Cargo minors and all majors stay
# manual. See .github/workflows/dependabot-auto-merge.yml.
version: 2
updates:
  # Three separate Cargo lockfiles: the root workspace, the desktop shell
  # workspace and the native WASAPI probe (excluded from the root).
  # Cargo minor updates wait for an audio check; major updates stay manual.
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/src-tauri"
      - "/tools/m00-wasapi-probe"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # windows-core must stay on the same release as the windows crate: COM
    # types from one release do not implement the other's traits. In
    # 2026-10, windows-core 0.100 existed while windows stopped at 0.62.2.
    # Upgrade both by hand when a matching windows release appears.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: windows-core
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor:
        update-types: [minor]
      cargo-major:
        update-types: [major]

  # Shipped or release-built npm projects. examples/ and videos/ are not
  # part of a release and are left out.
  - package-ecosystem: npm
    directories:
      - "/ui"
      - "/contracts"
      - "/tools/streamdeck"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      # The API-using tooling needs TypeScript 6 until the 7.0 API exists.
      # The separate typescript-7 alias remains the typechecking compiler.
      - dependency-name: typescript
        versions: ["7.0.2"]
    groups:
      npm-minor:
        update-types: [minor]
      npm-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      actions-minor:
        update-types: [minor]
      actions-major:
        update-types: [major]

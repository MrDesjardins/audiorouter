[package]
name = "audiorouter-transport"
version = "0.0.28"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
audiorouter-control = { path = "../control" }
audiorouter-domain = { path = "../domain" }
audiorouter-protocol = { path = "../protocol" }
audiorouter-windows-audio = { path = "../windows-audio" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
getrandom = "0.4.3"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
audiorouter-recording = { path = "../recording" }
audiorouter-engine = { path = "../engine" }
audiorouter-storage = { path = "../storage" }

# Same toolchain as CI and the release workflow, so local rustfmt and Clippy
# give the results CI gives. rustup installs it on first use.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
# i686: the 32-bit plugin worker, which hosts 32-bit VST plugins.
targets = ["i686-pc-windows-msvc"]

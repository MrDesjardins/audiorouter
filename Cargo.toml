[workspace]
resolver = "2"
members = ["crates/domain", "crates/control", "crates/protocol", "crates/storage", "crates/cli", "crates/transport", "crates/windows-audio", "crates/engine", "crates/recording", "crates/dsp", "crates/plugin-host", "crates/driver-helper"]
exclude = ["tools/m00-wasapi-probe"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
zip = "2.2.2"
sha2 = "0.10.9"
memmap2 = "0.9.9"
trash = "5.2.2"

[workspace.lints.clippy]
# Every `unsafe` block and impl states its invariants in a `// SAFETY:`
# comment (AGENTS.md, architecture rules); public unsafe fns document
# their contract under `# Safety`. CI's `-D warnings` Clippy enforces it
# for every target, tests and examples included.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

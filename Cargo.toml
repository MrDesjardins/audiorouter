[workspace]
resolver = "2"
members = ["crates/domain", "crates/control", "crates/protocol", "crates/storage", "crates/cli", "crates/transport", "crates/windows-audio", "crates/engine"]
exclude = ["tools/m00-wasapi-probe"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
zip = "2.2.2"
sha2 = "0.10.9"

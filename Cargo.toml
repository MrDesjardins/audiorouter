[workspace]
resolver = "2"
members = ["crates/domain", "crates/control", "crates/protocol"]
exclude = ["tools/m00-wasapi-probe"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

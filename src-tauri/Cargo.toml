[package]
name = "audiorouter-shell"
version = "0.0.14"
description = "AudioRouter native desktop shell"
authors = ["AudioRouter contributors"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
# Keep the feature table explicit so `cargo tauri build` does not rewrite the
# manifest during the disposable installer smoke.
tauri-build = { version = "2.6.3", features = [] }

[lints.clippy]
# Every `unsafe` block and impl states its invariants in a `// SAFETY:`
# comment (AGENTS.md, architecture rules); public unsafe fns document
# their contract under `# Safety`. CI's `-D warnings` Clippy enforces it
# for every target, tests and examples included.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[dependencies]
audiorouter-control = { path = "../crates/control" }
audiorouter-domain = { path = "../crates/domain" }
audiorouter-protocol = { path = "../crates/protocol" }
audiorouter-storage = { path = "../crates/storage" }
audiorouter-transport = { path = "../crates/transport" }
audiorouter-windows-audio = { path = "../crates/windows-audio" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
getrandom = "0.3.4"
tauri = { version = "2.11.5", features = ["tray-icon"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
audiorouter-control = { path = "../crates/control" }
audiorouter-engine = { path = "../crates/engine" }

[workspace]

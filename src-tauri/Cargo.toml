[package]
name = "audiorouter-shell"
version = "0.1.0"
description = "AudioRouter native desktop shell"
authors = ["AudioRouter contributors"]
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
audiorouter-protocol = { path = "../crates/protocol" }
audiorouter-transport = { path = "../crates/transport" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[workspace]

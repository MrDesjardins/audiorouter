    <g fill="#c9d5e3" font-size="12"><text x="132" y="140">PLAY / STOP</text><text x="320" y="140">RECORD</text><text x="508" y="140">PRIVACY MUTE</text><text x="132" y="276">LEVEL METER</text><text x="320" y="276">SESSIONS</text><text x="508" y="276">LEVEL</text></g>
  </g>
  <path d="M320 340v14m-56 0h112" stroke="#65758a" stroke-width="4" stroke-linecap="round"/>

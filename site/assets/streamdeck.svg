  <title id="title">AudioRouter Stream Deck integration</title>
  <desc id="desc">A Stream Deck grid with keys for playback, recording, microphone privacy, level, meters, and sessions connected to AudioRouter.</desc>
  <defs><linearGradient id="case" x2="0" y2="1"><stop stop-color="#263342"/><stop offset="1" stop-color="#151c26"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000" flood-opacity=".45"/></filter></defs>
  <rect x="24" y="20" width="592" height="320" rx="28" fill="url(#case)" stroke="#46576c" stroke-width="2" filter="url(#shadow)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g fill="#111821" stroke="#405066"><rect x="53" y="49" width="158" height="112" rx="15"/><rect x="241" y="49" width="158" height="112" rx="15"/><rect x="429" y="49" width="158" height="112" rx="15"/><rect x="53" y="185" width="158" height="112" rx="15"/><rect x="241" y="185" width="158" height="112" rx="15"/><rect x="429" y="185" width="158" height="112" rx="15"/></g>

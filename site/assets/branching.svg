<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" role="img" aria-labelledby="title desc">
  <title id="title">One source mixed and routed to three destinations</title><desc id="desc">A source enters a Mixer, whose output branches to voice chat, monitoring, and recording with animated signal dots.</desc>
  <g fill="none" stroke="#426b60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M108 105H190M278 105H310V37H350M310 105H350M310 105V176H350"/></g>
  <g fill="none" stroke="#67d5b3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"><path d="M108 105H190M278 105H310V37H350M310 105H350M310 105V176H350"/></g>
  <g fill="#17212c" stroke="#5b718b" stroke-width="1.5"><rect x="28" y="78" width="80" height="54" rx="10"/><rect x="190" y="74" width="88" height="62" rx="10"/><rect x="350" y="12" width="105" height="50" rx="10"/><rect x="350" y="80" width="105" height="50" rx="10"/><rect x="350" y="151" width="105" height="50" rx="10"/></g>
  <g fill="#e7edf5" font-family="Arial,sans-serif" font-size="12" text-anchor="middle"><text x="68" y="110">Source</text><text x="234" y="110">Mixer</text><text x="402" y="42">Voice</text><text x="402" y="110">Monitor</text><text x="402" y="181">Record</text></g>
  <g fill="#91efd2"><circle class="comet" r="4"><animateMotion dur="1.3s" repeatCount="indefinite" path="M108 105H190"/></circle><circle class="comet" r="4"><animateMotion dur="1.1s" begin=".2s" repeatCount="indefinite" path="M278 105H310V37H350"/></circle><circle class="comet" r="4"><animateMotion dur="1.1s" begin=".45s" repeatCount="indefinite" path="M278 105H310V105H350"/></circle><circle class="comet" r="4"><animateMotion dur="1.1s" begin=".7s" repeatCount="indefinite" path="M278 105H310V176H350"/></circle></g>
  <style>@media(prefers-reduced-motion:reduce){.comet{display:none}}</style>
</svg>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="pi.css">
  <script src="pi.js"></script>
</head>
<body>
  <div id="connection-slot"></div>
  <label>This key<select id="mode">
    <option value="toggle">Mutes and unmutes (toggle)</option>
    <option value="mute">Only mutes</option>
    <option value="unmute">Only unmutes</option>
  </select></label>
  <p class="hint">Privacy mute silences your microphone everywhere AudioRouter sends it. Use two keys (Only mutes, Only unmutes) if you prefer separate buttons.</p>
  <script>
    const mode = document.getElementById("mode");
    PI.onSettings = (settings) => { mode.value = settings.mode ?? "toggle"; };
    mode.addEventListener("change", () => PI.saveSettings({ mode: mode.value }));
  </script>
</body>
</html>
